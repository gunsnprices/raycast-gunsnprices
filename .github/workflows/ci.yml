name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx ray build -e dist
      - run: npm test
      # ray lint also checks that package.json "author" is a real Raycast user, which needs the network;
      # ESLint and Prettier cover the code itself.
      - run: npx eslint src
      - run: npx prettier --check src
